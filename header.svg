<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Hi, I'm Rana. Teaching neural networks to predict wireless channels." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1e3d"/>
      <stop offset="1" stop-color="#1b3a6b"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" x2="1">
      <stop offset="0" stop-color="#5ee0d0"/>
      <stop offset="1" stop-color="#ffb86b"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .title { font: 700 62px "Avenir Next", "Segoe UI", Ubuntu, "Helvetica Neue", Arial, sans-serif; fill: #ffffff; letter-spacing: -1px; opacity: 0; animation: rise 1s ease-out .2s forwards; }
    .sub   { font: 500 24px "Avenir Next", "Segoe UI", Ubuntu, "Helvetica Neue", Arial, sans-serif; fill: #5ee0d0; opacity: 0; animation: rise 1s ease-out .7s forwards; }
    .tag   { font: 400 17px "Avenir Next", "Segoe UI", Ubuntu, "Helvetica Neue", Arial, sans-serif; fill: #c7d2fe; opacity: 0; animation: rise 1s ease-out 1.1s forwards; }
    .pt    { fill: #ffb86b; animation: pulse 2.4s ease-in-out infinite; }
    .axis  { stroke: #c7d2fe; stroke-opacity: .25; stroke-width: 1; }
    .lbl   { font: 400 13px "Avenir Next", "Segoe UI", Ubuntu, Arial, sans-serif; fill: #c7d2fe; fill-opacity: .6; }
    @keyframes rise  { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .title, .sub, .tag { animation: none; opacity: 1; } .pt { animation: none; } }
  </style>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- Text -->
  <text class="title" x="80" y="112">Hi, I'm Rana</text>
  <text class="sub" x="82" y="154">Teaching neural networks to predict wireless channels</text>
  <text class="tag" x="82" y="186">Grad researcher at Northeastern, working on 5G NR and deep learning</text>

  <!-- 16-QAM constellation -->
  <g transform="translate(985 45)">
    <line class="axis" x1="-15" y1="60" x2="135" y2="60"/>
    <line class="axis" x1="60" y1="-15" x2="60" y2="135"/>
    <g>
      <circle class="pt" cx="0"   cy="0"   r="4.5" style="animation-delay:0s"/>
      <circle class="pt" cx="40"  cy="0"   r="4.5" style="animation-delay:.15s"/>
      <circle class="pt" cx="80"  cy="0"   r="4.5" style="animation-delay:.3s"/>
      <circle class="pt" cx="120" cy="0"   r="4.5" style="animation-delay:.45s"/>
      <circle class="pt" cx="0"   cy="40"  r="4.5" style="animation-delay:.6s"/>
      <circle class="pt" cx="40"  cy="40"  r="4.5" style="animation-delay:.75s"/>
      <circle class="pt" cx="80"  cy="40"  r="4.5" style="animation-delay:.9s"/>
      <circle class="pt" cx="120" cy="40"  r="4.5" style="animation-delay:1.05s"/>
      <circle class="pt" cx="0"   cy="80"  r="4.5" style="animation-delay:1.2s"/>
      <circle class="pt" cx="40"  cy="80"  r="4.5" style="animation-delay:1.35s"/>
      <circle class="pt" cx="80"  cy="80"  r="4.5" style="animation-delay:1.5s"/>
      <circle class="pt" cx="120" cy="80"  r="4.5" style="animation-delay:1.65s"/>
      <circle class="pt" cx="0"   cy="120" r="4.5" style="animation-delay:1.8s"/>
      <circle class="pt" cx="40"  cy="120" r="4.5" style="animation-delay:1.95s"/>
      <circle class="pt" cx="80"  cy="120" r="4.5" style="animation-delay:2.1s"/>
      <circle class="pt" cx="120" cy="120" r="4.5" style="animation-delay:2.25s"/>
    </g>
    <text class="lbl" x="60" y="155" text-anchor="middle">16-QAM</text>
  </g>

  <!-- Signal traces (seamless loops: shift = one period) -->
  <path d="M0 232 Q100 207 200 232 T400 232 T600 232 T800 232 T1000 232 T1200 232 T1400 232 T1600 232"
        fill="none" stroke="url(#trace)" stroke-width="2.5" filter="url(#glow)" opacity=".9">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-400 0" dur="6s" repeatCount="indefinite"/>
  </path>
  <path d="M-300 246 Q-225 232 -150 246 T0 246 T150 246 T300 246 T450 246 T600 246 T750 246 T900 246 T1050 246 T1200 246"
        fill="none" stroke="#5ee0d0" stroke-width="1.5" opacity=".45">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="300 0" dur="5s" repeatCount="indefinite"/>
  </path>

  <!-- Filled waves at the bottom -->
  <path d="M0 272 Q150 254 300 272 T600 272 T900 272 T1200 272 T1500 272 T1800 272 V300 H0 Z" fill="#5ee0d0" opacity=".14">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="11s" repeatCount="indefinite"/>
  </path>
  <path d="M-400 282 Q-300 270 -200 282 T0 282 T200 282 T400 282 T600 282 T800 282 T1000 282 T1200 282 V300 H-400 Z" fill="#ffb86b" opacity=".16">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="400 0" dur="8s" repeatCount="indefinite"/>
  </path>
</svg>
